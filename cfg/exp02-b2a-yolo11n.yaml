# EXP02 (Table 2, row 2) — DySample + C3k2Rep.
#
# One half of the 2x2 factorial that splits EXP04's two simultaneous swaps apart. EXP04
# replaced BOTH the upsampler (DySample -> bilinear) and the block family (C3k2Ghost ->
# C3k2Rep) at once, so its +3.4 mAP50 / -1.6 ms could not be attributed. This file keeps
# DySample and changes only the blocks, so EXP02 vs EXP01 isolates what RepConv alone buys.
#
#   EXP01  DySample + Ghost   0.557M / 6.16G   <- baseline of the grid
#   EXP02  DySample + Rep     0.900M / 9.21G   <- this file
#   EXP03  Bilinear + Ghost   0.550M / 6.18G
#   EXP04  Bilinear + Rep     0.893M / 9.23G
#
# Measured (build + fuse, imgsz 640): 0.945M raw -> 0.900M / 9.21 GFLOPs after RepConv
# reparameterization. Note the grid's cost structure: the block swap adds ~0.34M / ~3.05G
# in BOTH rows while the upsampler swap is nearly free -- all of EXP04's extra compute
# comes from RepConv, none of it from bilinear.
#
# Run: python train.py --config configs/exp02.yaml

nc: 10 # VisDrone classes

scales: # [depth, width, max_channels]
  n: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]                    (shapes @ 960x960 input, n scale)
  - [-1, 1, Conv, [16, 3, 2]] # 0  P1/2   16x480x480
  - [-1, 1, SPDConvGroup, [32]] # 1  P2/4   32x240x240
  - [-1, 2, C3k2Rep, [64, False, 0.25]] # 2         64x240x240
  - [-1, 1, SPDConvGroup, [64]] # 3  P3/8   64x120x120
  - [-1, 2, C3k2Rep, [128, False, 0.25]] # 4        128x120x120
  - [-1, 1, EMA, [128]] # 5         128x120x120
  - [-1, 1, SPDConvGroup, [128]] # 6  P4/16  128x60x60
  - [-1, 2, C3k2Rep, [128, True]] # 7               128x60x60
  - [-1, 1, SPPF, [128, 5]] # 8               128x60x60
  - [-1, 1, C2PSA, [128]] # 9               128x60x60

head:
  # top-down
  - [-1, 1, DySample, [128, 2]] # 10 P4 -> P3 size (kept, unlike EXP04)
  - [[-1, 5], 1, BiFPNCat, [2]] # 11 128+128=256
  - [-1, 1, C3k2Rep, [96, False]] # 12 P3 intermediate
  - [-1, 1, DySample, [96, 2]] # 13 P3 -> P2 size (kept, unlike EXP04)
  - [[-1, 2], 1, BiFPNCat, [2]] # 14 96+64=160
  - [-1, 1, C3k2Rep, [48, False]] # 15 P2/4 out
  - [-1, 1, ECA, [48]] # 16 cheap channel attention on P2 (small-object features)
  # bottom-up
  - [-1, 1, SPDConvGroup, [96]] # 17 P2 -> P3 size
  - [[-1, 12], 1, BiFPNCat, [2]] # 18 96+96=192
  - [-1, 1, C3k2Rep, [96, False]] # 19 P3/8 out
  - [-1, 1, SPDConvGroup, [128]] # 20 P3 -> P4 size
  - [[-1, 9], 1, BiFPNCat, [2]] # 21 128+128=256
  - [-1, 1, C3k2Rep, [128, True]] # 22 P4/16 out

  - [[16, 19, 22], 1, LSCDetect, [nc, 48]] # 23 shared-conv GN head (P2, P3, P4), hidc=48

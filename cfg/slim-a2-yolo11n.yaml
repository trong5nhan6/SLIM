# SLIM-A2 — capacity-rebalance ablation: slim-yolo11n.yaml with MORE channels at P3/P4 and
# the P2 branch left thin.
#
# Rationale (see the latency analysis): P2 (stride 4) is both the source of small-object
# recall AND the most latency-expensive scale (it runs at 4x the spatial resolution of P3).
# Adding capacity at P3/P4 (lower resolution) buys semantic strength for near-free latency,
# while keeping P2 thin protects speed. So this variant thickens the P3 intermediate, P3
# output and P4 output necks, and leaves the P2 output (layer 14, 48ch) untouched.
#
# ONLY change vs cfg/slim-yolo11n.yaml is neck widths at P3/P4 (marked <-- A2 below).
# Run via: python train.py --config configs/slim-a2.yaml

nc: 10 # VisDrone classes

scales: # [depth, width, max_channels]
  n: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]                    (shapes @ 960x960 input, n scale)
  - [-1, 1, Conv, [16, 3, 2]] # 0  P1/2   16x480x480
  - [-1, 1, SPDConvGroup, [32]] # 1  P2/4   32x240x240
  - [-1, 2, C3k2Ghost, [64, False, 0.25]] # 2         64x240x240
  - [-1, 1, SPDConvGroup, [64]] # 3  P3/8   64x120x120
  - [-1, 2, C3k2Ghost, [128, False, 0.25]] # 4        128x120x120
  - [-1, 1, EMA, [128]] # 5         128x120x120
  - [-1, 1, SPDConvGroup, [128]] # 6  P4/16  128x60x60
  - [-1, 2, C3k2Ghost, [128, True]] # 7               128x60x60
  - [-1, 1, SPPF, [128, 5]] # 8               128x60x60
  - [-1, 1, C2PSA, [128]] # 9               128x60x60

head:
  # top-down
  - [-1, 1, DySample, [128, 2]] # 10 P4 -> P3 size
  - [[-1, 5], 1, BiFPNCat, [2]] # 11 128+128=256
  - [-1, 1, C3k2Ghost, [96, False]] # 12 P3 intermediate  (kept 96 — P3 res is expensive)
  - [-1, 1, DySample, [96, 2]] # 13 P3 -> P2 size          (kept 96)
  - [[-1, 2], 1, BiFPNCat, [2]] # 14 96+64=160
  - [-1, 1, C3k2Ghost, [48, False]] # 15 P2/4 out (kept thin at 48) <-- A2: P2 unchanged
  - [-1, 1, ECA, [48]] # 16 cheap channel attention on P2 (small-object features)
  # bottom-up
  - [-1, 1, SPDConvGroup, [96]] # 17 P2 -> P3 size          (kept 96 — P3 res is expensive)
  - [[-1, 12], 1, BiFPNCat, [2]] # 18 96+96=192
  - [-1, 1, C3k2Ghost, [96, False]] # 19 P3/8 out           (kept 96)
  - [-1, 1, SPDConvGroup, [144]] # 20 P3 -> P4 size         (128 -> 144) <-- A2 (P4 res is cheap)
  - [[-1, 9], 1, BiFPNCat, [2]] # 21 144+128=272
  - [-1, 1, C3k2Ghost, [144, True]] # 22 P4/16 out          (128 -> 144) <-- A2

  - [[16, 19, 22], 1, LSCDetect, [nc, 48]] # 23 shared-conv GN head (P2, P3, P4), hidc=48

# EXP04 (Table 2 row 4 = Table 3 row 5 = Table 4 row 11) — Ours-N, the FLAGSHIP.
#
# cfg/exp01-slim-yolo11n.yaml with the two memory-bound
# op families swapped for GPU-friendly ones, SPDConv KEPT (its lossless space-to-depth is
# what protects few-pixel objects, so replacing it would fight the small-object goal).
#
#   * DySample (learned grid_sample upsampler, memory-bound) -> nn.Upsample bilinear.
#   * C3k2Ghost (GhostBottleneck, low-FLOP but low GPU utilisation) -> C3k2Rep (RepConv
#     3x3 blocks that reparameterize to a single dense 3x3 at inference). This RAISES FLOPs
#     but is expected to LOWER wall-clock latency at batch=1 — the whole point of B2.
#
# SPDConvGroup, EMA, ECA, C2PSA, BiFPNCat and the LSCDetect head are unchanged.
# Measured: 0.938M / 9.79 GFLOPs raw -> 0.893M / 9.23 GFLOPs after fuse + RepConv
# reparameterization. Trained result: mAP50 0.3284, 98.0 FPS (T4, batch=1) — both the best
# accuracy AND the best latency in the family, despite the higher FLOPs.
#
# Run: python train.py --config configs/exp04.yaml

nc: 10 # VisDrone classes

scales: # [depth, width, max_channels]
  n: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]                    (shapes @ 960x960 input, n scale)
  - [-1, 1, Conv, [16, 3, 2]] # 0  P1/2   16x480x480
  - [-1, 1, SPDConvGroup, [32]] # 1  P2/4   32x240x240
  - [-1, 2, C3k2Rep, [64, False, 0.25]] # 2         64x240x240
  - [-1, 1, SPDConvGroup, [64]] # 3  P3/8   64x120x120
  - [-1, 2, C3k2Rep, [128, False, 0.25]] # 4        128x120x120
  - [-1, 1, EMA, [128]] # 5         128x120x120
  - [-1, 1, SPDConvGroup, [128]] # 6  P4/16  128x60x60
  - [-1, 2, C3k2Rep, [128, True]] # 7               128x60x60
  - [-1, 1, SPPF, [128, 5]] # 8               128x60x60
  - [-1, 1, C2PSA, [128]] # 9               128x60x60

head:
  # top-down
  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]] # 10 P4 -> P3 size (was DySample)
  - [[-1, 5], 1, BiFPNCat, [2]] # 11 128+128=256
  - [-1, 1, C3k2Rep, [96, False]] # 12 P3 intermediate
  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]] # 13 P3 -> P2 size (was DySample)
  - [[-1, 2], 1, BiFPNCat, [2]] # 14 96+64=160
  - [-1, 1, C3k2Rep, [48, False]] # 15 P2/4 out
  - [-1, 1, ECA, [48]] # 16 cheap channel attention on P2 (small-object features)
  # bottom-up
  - [-1, 1, SPDConvGroup, [96]] # 17 P2 -> P3 size
  - [[-1, 12], 1, BiFPNCat, [2]] # 18 96+96=192
  - [-1, 1, C3k2Rep, [96, False]] # 19 P3/8 out
  - [-1, 1, SPDConvGroup, [128]] # 20 P3 -> P4 size
  - [[-1, 9], 1, BiFPNCat, [2]] # 21 128+128=256
  - [-1, 1, C3k2Rep, [128, True]] # 22 P4/16 out

  - [[16, 19, 22], 1, LSCDetect, [nc, 48]] # 23 shared-conv GN head (P2, P3, P4), hidc=48

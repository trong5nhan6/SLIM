# EXP12 (Table 4, row 12) — EXP04 with the stock ultralytics Detect head.
#
# Ablates the paper's first claim: that LSCDetect (per-scale 1x1 align to a shared 48ch
# width -> ONE shared 3x3 dense + 3x3 depthwise GN stack -> ONE shared box conv + ONE
# shared cls conv) is what makes a P2 pyramid affordable at all. Stock Detect gives every
# scale its own private cv2/cv3 stacks instead.
#
# Measured (build + fuse, imgsz 640): 1.316M / 15.68 GFLOPs, against EXP04's 0.893M /
# 9.23G -- +0.42M params and +6.45 GFLOPs, i.e. +70% compute for the head swap alone.
# The reason is resolution, not width: the head runs at every scale, and P2 at 160x160 is
# 16x the area of P4, so each extra head kernel is paid 16-fold.
#
# Reading the result: mAP50 here may come out HIGHER than EXP04 (it has 0.42M more
# parameters). That does not overturn the claim -- the comparison to make is marginal:
# stock Detect trades +70% GFLOPs for +X mAP50, and LSCDetect wins outright unless X is
# large. Report mAP and GFLOPs side by side, never mAP alone.
#
# Everything else is byte-identical to cfg/exp04-ours-yolo11n.yaml.
# Run: python train.py --config configs/exp12.yaml

nc: 10 # VisDrone classes

scales: # [depth, width, max_channels]
  n: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]                    (shapes @ 960x960 input, n scale)
  - [-1, 1, Conv, [16, 3, 2]] # 0  P1/2   16x480x480
  - [-1, 1, SPDConvGroup, [32]] # 1  P2/4   32x240x240
  - [-1, 2, C3k2Rep, [64, False, 0.25]] # 2         64x240x240
  - [-1, 1, SPDConvGroup, [64]] # 3  P3/8   64x120x120
  - [-1, 2, C3k2Rep, [128, False, 0.25]] # 4        128x120x120
  - [-1, 1, EMA, [128]] # 5         128x120x120
  - [-1, 1, SPDConvGroup, [128]] # 6  P4/16  128x60x60
  - [-1, 2, C3k2Rep, [128, True]] # 7               128x60x60
  - [-1, 1, SPPF, [128, 5]] # 8               128x60x60
  - [-1, 1, C2PSA, [128]] # 9               128x60x60

head:
  # top-down
  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]] # 10 P4 -> P3 size
  - [[-1, 5], 1, BiFPNCat, [2]] # 11 128+128=256
  - [-1, 1, C3k2Rep, [96, False]] # 12 P3 intermediate
  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]] # 13 P3 -> P2 size
  - [[-1, 2], 1, BiFPNCat, [2]] # 14 96+64=160
  - [-1, 1, C3k2Rep, [48, False]] # 15 P2/4 out
  - [-1, 1, ECA, [48]] # 16 cheap channel attention on P2 (small-object features)
  # bottom-up
  - [-1, 1, SPDConvGroup, [96]] # 17 P2 -> P3 size
  - [[-1, 12], 1, BiFPNCat, [2]] # 18 96+96=192
  - [-1, 1, C3k2Rep, [96, False]] # 19 P3/8 out
  - [-1, 1, SPDConvGroup, [128]] # 20 P3 -> P4 size
  - [[-1, 9], 1, BiFPNCat, [2]] # 21 128+128=256
  - [-1, 1, C3k2Rep, [128, True]] # 22 P4/16 out

  - [[16, 19, 22], 1, Detect, [nc]] # 23 stock per-scale head (was LSCDetect)

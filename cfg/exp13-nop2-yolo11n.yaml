# EXP13 (Table 4, row 13) — EXP04 without the P2 branch.
#
# Ablates the premise the whole paper rests on: that VisDrone's objects are small enough
# to need a stride-4 detection level. This is the "w/o P2" row every small-object paper is
# expected to show.
#
# NOTE ON WHAT "removing P2" MEANS HERE: this backbone stops at P4/16 (SPPF + C2PSA) and
# has NO P5 stage, so dropping P2 leaves a TWO-scale head (P3/8 + P4/16), not the usual
# P3-P5 trio. Removed: the P3->P2 upsample, its BiFPNCat with backbone layer 2, the 48ch
# P2 output block, its ECA, and the P2->P3 bottom-up rung; the graph is re-indexed
# accordingly. Turning this into a conventional P3-P5 pyramid would mean ADDING a stride-32
# stage, i.e. changing two things at once -- kept out on purpose (one variable per row).
#
# Measured (build + fuse, imgsz 640): 0.774M / 5.47 GFLOPs vs EXP04's 0.893M / 9.23G --
# P2 costs 3.76 GFLOPs, 41% of the whole model, because it runs at 4x the linear
# resolution of P3.
#
# Reading the result: expect mAP to fall, hardest on pedestrian / people / motor / bicycle.
# Report the PER-CLASS table for this row (val.py already prints it) -- the per-class
# collapse on the four smallest classes is far more convincing than the aggregate drop.
#
# Run: python train.py --config configs/exp13.yaml

nc: 10 # VisDrone classes

scales: # [depth, width, max_channels]
  n: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]                    (shapes @ 960x960 input, n scale)
  - [-1, 1, Conv, [16, 3, 2]] # 0  P1/2   16x480x480
  - [-1, 1, SPDConvGroup, [32]] # 1  P2/4   32x240x240
  - [-1, 2, C3k2Rep, [64, False, 0.25]] # 2         64x240x240
  - [-1, 1, SPDConvGroup, [64]] # 3  P3/8   64x120x120
  - [-1, 2, C3k2Rep, [128, False, 0.25]] # 4        128x120x120
  - [-1, 1, EMA, [128]] # 5         128x120x120
  - [-1, 1, SPDConvGroup, [128]] # 6  P4/16  128x60x60
  - [-1, 2, C3k2Rep, [128, True]] # 7               128x60x60
  - [-1, 1, SPPF, [128, 5]] # 8               128x60x60
  - [-1, 1, C2PSA, [128]] # 9               128x60x60

head:
  # top-down (stops at P3 -- no P2 rung)
  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]] # 10 P4 -> P3 size
  - [[-1, 5], 1, BiFPNCat, [2]] # 11 128+128=256
  - [-1, 1, C3k2Rep, [96, False]] # 12 P3/8 out (was the P3 intermediate)
  # bottom-up
  - [-1, 1, SPDConvGroup, [128]] # 13 P3 -> P4 size
  - [[-1, 9], 1, BiFPNCat, [2]] # 14 128+128=256
  - [-1, 1, C3k2Rep, [128, True]] # 15 P4/16 out

  - [[12, 15], 1, LSCDetect, [nc, 48]] # 16 shared-conv GN head, TWO scales (P3, P4)

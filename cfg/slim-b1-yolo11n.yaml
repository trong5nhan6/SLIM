# SLIM-B1 — latency ablation: slim-yolo11n.yaml with the LSCDetect head swapped for the
# fuse-able LSCDetectBN (Conv+BatchNorm+SiLU instead of Conv+GroupNorm).
#
# GroupNorm cannot be folded into its conv, so slim's head runs 3 separate kernels per scale
# at inference (paid at 4x resolution on P2). LSCDetectBN uses stock ultralytics Conv, which
# DetectionModel.fuse() collapses to a single kernel per conv. Identical shared-conv topology
# and hidc=48 — this changes ONLY the head norm/fuse behaviour vs slim.
#
# ONLY change vs cfg/slim-yolo11n.yaml is the head module (last line). Trade-off (BN stats
# shared across scales at batch=8) is measured by the real run, not assumed.
# Run via: python train.py --config configs/slim-b1.yaml

nc: 10 # VisDrone classes

scales: # [depth, width, max_channels]
  n: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]                    (shapes @ 960x960 input, n scale)
  - [-1, 1, Conv, [16, 3, 2]] # 0  P1/2   16x480x480
  - [-1, 1, SPDConvGroup, [32]] # 1  P2/4   32x240x240
  - [-1, 2, C3k2Ghost, [64, False, 0.25]] # 2         64x240x240
  - [-1, 1, SPDConvGroup, [64]] # 3  P3/8   64x120x120
  - [-1, 2, C3k2Ghost, [128, False, 0.25]] # 4        128x120x120
  - [-1, 1, EMA, [128]] # 5         128x120x120
  - [-1, 1, SPDConvGroup, [128]] # 6  P4/16  128x60x60
  - [-1, 2, C3k2Ghost, [128, True]] # 7               128x60x60
  - [-1, 1, SPPF, [128, 5]] # 8               128x60x60
  - [-1, 1, C2PSA, [128]] # 9               128x60x60

head:
  # top-down
  - [-1, 1, DySample, [128, 2]] # 10 P4 -> P3 size
  - [[-1, 5], 1, BiFPNCat, [2]] # 11 128+128=256
  - [-1, 1, C3k2Ghost, [96, False]] # 12 P3 intermediate
  - [-1, 1, DySample, [96, 2]] # 13 P3 -> P2 size
  - [[-1, 2], 1, BiFPNCat, [2]] # 14 96+64=160
  - [-1, 1, C3k2Ghost, [48, False]] # 15 P2/4 out
  - [-1, 1, ECA, [48]] # 16 cheap channel attention on P2 (small-object features)
  # bottom-up
  - [-1, 1, SPDConvGroup, [96]] # 17 P2 -> P3 size
  - [[-1, 12], 1, BiFPNCat, [2]] # 18 96+96=192
  - [-1, 1, C3k2Ghost, [96, False]] # 19 P3/8 out
  - [-1, 1, SPDConvGroup, [128]] # 20 P3 -> P4 size
  - [[-1, 9], 1, BiFPNCat, [2]] # 21 128+128=256
  - [-1, 1, C3k2Ghost, [128, True]] # 22 P4/16 out

  - [[16, 19, 22], 1, LSCDetectBN, [nc, 48]] # 23 fuse-able BN head (P2, P3, P4), hidc=48

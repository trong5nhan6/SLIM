# Idea slim — COMBO: A2 (P4 rebalance) + B1 (fuse-able BN head) + B3 (no EMA) baked into
# cfg/slim-combo-yolo11n.yaml, PLUS A3 (small-object loss tuning) applied here via the NWD
# knobs. This is the "all budget-safe improvements" candidate (excludes B2 which broke the
# GFLOPs budget, and A1/KD which is a separate distillation run via configs/pd.yaml).
# Run via: python train.py --config configs/slim-combo.yaml

idea: slim
model_cfg: cfg/slim-combo-yolo11n.yaml
use_nwd: true
nwd_ratio: 0.3 # A3: 0.3 CIoU / 0.7 NWD
nwd_constant: 4.0 # A3: smaller C for stride-normalized boxes (was 12.8)
name: slim-combo
